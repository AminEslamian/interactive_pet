<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miko • Minimal Desktop Pet & 25m Eye-Rest</title>
  <meta name="description" content="A minimal, aesthetic Japanese kitsune desktop pet. Folds into a subtle zen spirit dot, stretches organically, and reminds you every 25 minutes to rest your eyes." />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <!-- Ambient Atmosphere -->
  <div class="zen-atmosphere"></div>
  <canvas id="sakuraCanvas"></canvas>

  <div class="zen-container">
    <!-- Top Minimal Navigation -->
    <header class="zen-header">
      <div class="zen-brand">
        <img src="./miko_avatar.png" class="zen-brand-avatar" alt="Miko" />
        <span class="zen-brand-name">Miko</span>
        <span class="zen-badge">Zen Companion</span>
      </div>

      <div class="zen-nav-tools">
        <!-- Quick State Switchers -->
        <button id="btnSwitchDot" class="zen-tool-btn" title="Minimize into Zen Dot">
          <span>⚪</span>
          <span class="tool-label">Zen Dot</span>
        </button>
        <button id="btnSwitchFox" class="zen-tool-btn active" title="Awaken Fox Companion">
          <span>🦊</span>
          <span class="tool-label">Awake Fox</span>
        </button>
        <button id="soundToggleBtn" class="zen-tool-btn" title="Toggle Peaceful Chimes & Sounds">
          <span>🔔</span>
          <span class="tool-label">Sound On</span>
        </button>
        <button id="ttsToggleBtn" class="zen-tool-btn" title="Toggle Text-to-Speech Aloud">
          <span>🗣️</span>
          <span class="tool-label">Voice: OFF</span>
        </button>
      </div>
    </header>

    <!-- Center Stage: Minimal Interactive Pet -->
    <main class="zen-main">
      <!-- Quick Micro-Interactions -->
      <nav class="zen-actions-bar">
        <button class="zen-action-pill" id="btnStretchTogether">
          <span>🌸</span> Stretch Together
        </button>
        <button class="zen-action-pill" id="btnAskAdvice">
          <span>💬</span> Wisdom
        </button>
        <button class="zen-action-pill" id="btnCheckPosture">
          <span>🧘</span> Posture Check
        </button>
        <button class="zen-action-pill" id="btnCurlSleep">
          <span>🌙</span> Curl to Sleep
        </button>
      </nav>

      <!-- Pet Mount Point -->
      <div id="petStage"></div>
    </main>

    <!-- Bottom Dock: Minimal Focus & Eye-Rest Bar -->
    <footer class="zen-footer">
      <div id="timerDock"></div>
    </footer>
  </div>

  <!-- 20-Second Meditative Eye-Rest Overlay (Body Level for Stacking Context) -->
  <div class="zen-eye-overlay" id="zenEyeOverlay">
    <div class="eye-overlay-bg"></div>
    <div class="eye-ritual-card">
      <div class="ritual-header">
        <span class="ritual-tag">✨ 20-20-20 Eye Relaxation</span>
        <h2 id="ritualTitle">Gaze into the Far Distance</h2>
        <p id="ritualSubtitle">Look away from your screen. Let your gaze soften upon something 20 feet away.</p>
      </div>

      <div class="ritual-orb-stage">
        <div class="ambient-eye-orb" id="ambientEyeOrb">
          <span class="orb-flame">🌸</span>
        </div>
        <div class="ritual-timer-num" id="ritualCountdown">20s</div>
      </div>

      <div class="ritual-footer">
        <button class="zen-btn primary-glow" id="btnFinishRitual">I Feel Refreshed</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
